name: B unit tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-b.txt
      - run: python -m pip install -r requirements-b.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/reproduce_b.sh
